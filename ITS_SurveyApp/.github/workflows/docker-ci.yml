name: Analyze and Build Docker Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  e2e-test:
    name: E2E Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm install --prefix BE

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start app and wait until ready
        run: |
          PORT=8080 node BE/server.js > /tmp/its-server.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://localhost:8080 >/dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          cat /tmp/its-server.log
          exit 1

      - name: Run CodeceptJS E2E Tests
        env:
          TEST_BASE_URL: http://localhost:8080
        run: npx codeceptjs run --steps

  build-and-push:
    name: Build and Push Docker Image
    needs: e2e-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: true
          tags: |
            hoainguyen0912/its-survey-be:latest
            hoainguyen0912/its-survey-be:${{ github.sha }}