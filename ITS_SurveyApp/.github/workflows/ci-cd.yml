name: KCPM E2E Testing & Docker Build Pipeline

on:
  push:
    branches: [main, v5.1-rc1]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  e2e-test-and-docker-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm install --prefix BE

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start App and Wait Until Ready
        run: |
          PORT=8080 node BE/server.js > /tmp/its-server.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://localhost:8080 >/dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          cat /tmp/its-server.log
          exit 1

      - name: Run CodeceptJS E2E Tests
        env:
          TEST_BASE_URL: http://localhost:8080
        run: npx codeceptjs run --steps

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push FE Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kcpm-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kcpm-fe:${{ github.ref_name }}