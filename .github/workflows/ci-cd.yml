
name: KCPM E2E Testing & Docker Build Pipeline

on:
  push:
    branches: [ main, hnguyen, v5.1-rc1 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-test-and-docker-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run CodeceptJS E2E Tests
        run: npx codeceptjs run --steps

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push FE Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kcpm-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kcpm-fe:${{ github.ref_name }}
